# AMD GPU overlay for the ollama service (ROCm). Linux hosts only: Docker on
# Windows/WSL2 doesn't expose AMD GPUs to containers, so there Ollama stays
# on CPU — use docker-compose.nvidia.yml or run without an overlay.
#
#   docker compose -f docker-compose.yml -f docker-compose.amd.yml up
#   (or a second -f https://github.com/MichalOndrejka/conduit.git#main:docker-compose.amd.yml)
#
# With this overlay, setup fails (and Conduit doesn't start) unless both
# models load fully onto the GPU. `docker compose logs ollama` shows what
# Ollama detected (the "inference compute" line should name ROCm).
services:
  ollama:
    image: ollama/ollama:rocm
    devices:
      - /dev/kfd
      - /dev/dri
  setup:
    environment:
      OLLAMA_GPU_EXPECTED: amd
