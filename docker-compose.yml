# Conduit + Qdrant.
#
# Ollama runs separately, on this machine (https://ollama.com/download), and
# is not checked or managed here. It runs natively, so it uses whatever GPU it
# supports — NVIDIA, AMD (including on Windows) or Apple — with no container
# GPU setup. Pull the models yourself (`ollama pull nomic-embed-text-v2-moe`).
# Its URL and models are set on Conduit's Settings page; the first-run
# default is http://host.docker.internal:11434/v1, i.e. the host's
# localhost:11434. On Linux, start Ollama with OLLAMA_HOST=0.0.0.0, since
# there host.docker.internal is the Docker bridge, not loopback.
#
# Install without a clone (this file, published to Docker Hub):
#   docker compose -f oci://docker.io/michalondrejka/conduit-compose:latest up -d
# Republish after changing it: `docker compose publish michalondrejka/conduit-compose:latest`.
# Later: `docker compose -p conduit logs conduit`, `... -p conduit down`.
#
# From a clone:  docker compose up --build
#
# Behind a corporate proxy, set HTTPS_PROXY (see docs/customization.md).
# Model downloads are made by the host's Ollama, so it needs its own proxy
# settings.

# Fixed so the stack is the same project whichever folder it's started from,
# and follow-up commands can use `docker compose -p conduit ...`.
name: conduit

services:
  qdrant:
    image: qdrant/qdrant:v1.13.6
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    # Not published by default, to avoid clashing with a Qdrant already on
    # the host. Uncomment for the dashboard at http://localhost:6333/dashboard.
    # ports:
    #   - "127.0.0.1:6333:6333"
    healthcheck:
      # The qdrant image has no curl/wget; probe the port with bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  conduit:
    build: .
    image: michalondrejka/conduit:latest
    restart: unless-stopped
    # Loopback only: Conduit has no authentication, so it must not be
    # reachable from other machines on the network.
    # Long form: `docker compose publish` fails to decode the short
    # "127.0.0.1:${CONDUIT_PORT:-8000}:8000" form.
    ports:
      - target: 8000
        published: "${CONDUIT_PORT:-8000}"
        host_ip: 127.0.0.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - conduit_data:/data
    environment:
      # Proxy for Azure DevOps and other source APIs. Service
      # names and the host are always in NO_PROXY so calls to Qdrant and
      # Ollama skip the proxy.
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,qdrant,conduit,host.docker.internal,${NO_PROXY:-}
      QDRANT_URL: http://qdrant:6333
      # Ollama's URL and the models are deliberately not set here: env vars
      # override the Settings page on every start, and Settings owns them.

      # Sync tuning: parallel embedding and preprocessing requests to Ollama.
      EMBEDDING_CONCURRENCY: ${EMBEDDING_CONCURRENCY:-4}
      PREPROCESSING_CONCURRENCY: ${PREPROCESSING_CONCURRENCY:-4}
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_data:
  conduit_data:
