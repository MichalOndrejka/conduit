services:
  qdrant:
    image: qdrant/qdrant:v1.13.6
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The qdrant image has no curl/wget; probe the port with bash's /dev/tcp instead.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
      # Drop extra trusted root CAs here (e.g. a corporate TLS-interception
      # proxy cert) if `ollama pull` fails with an x509 verification error —
      # additive to the image's default trust store, doesn't replace it.
      - ./certs:/usr/local/share/ca-certificates-extra:ro
    ports:
      - "11434:11434"   # optional — lets you `ollama pull`/debug from the host too
    environment:
      SSL_CERT_DIR: /usr/local/share/ca-certificates-extra
      # `ollama pull` (run by the ollama-pull service below) makes its actual
      # outbound HTTPS request from *this* container, not from ollama-pull —
      # ollama-pull just tells this server "fetch model X" over the internal
      # docker network. Set these if pulls fail behind a corporate proxy
      # (e.g. "error pulling model manifest: 403" from direct egress being
      # blocked). Leave unset/empty if you're not behind a proxy.
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      # Keep intra-compose and loopback traffic off the proxy.
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,ollama,qdrant,conduit}
      # Lets Ollama actually process concurrent requests instead of queuing
      # them one at a time — should roughly match conduit's embedding/
      # preprocessing concurrency (see EMBEDDING_CONCURRENCY below).
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-4}
      # Keep both the embedding model and the preprocessing/chat model
      # resident at once — without this, syncing alternates between them and
      # each switch can evict+reload the other model.
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      # Keep a model warm between sync runs instead of unloading it right
      # after each request.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: pulls the configured embedding/LLM models into the ollama
  # service above, then exits. conduit waits for this to finish so it never
  # starts syncing against a model that hasn't been downloaded yet.
  ollama-pull:
    image: ollama/ollama:latest
    volumes:
      - ./certs:/usr/local/share/ca-certificates-extra:ro
    environment:
      OLLAMA_HOST: ollama:11434
      SSL_CERT_DIR: /usr/local/share/ca-certificates-extra
    entrypoint: ["/bin/sh", "-c"]
    # A single list item so the whole script is one argv element for `-c`
    # (a plain scalar here gets shell-word-split into separate argv items by
    # Compose itself, which breaks `-c`'s single-string-argument contract).
    command:
      - >
        ollama pull ${EMBEDDING_MODEL:-nomic-embed-text-v2-moe} &&
        ollama pull ${PREPROCESSING_MODEL:-llama3.2:3b}
    depends_on:
      ollama:
        condition: service_healthy

  conduit:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - conduit_data:/data
      - ./config.json:/app/config.json   # mount config for easy editing without rebuild
    environment:
      # Bind to all interfaces inside the container so the port mapping below
      # can reach it (the Go binary defaults to loopback-only otherwise).
      CONDUIT_HOST: 0.0.0.0
      # Qdrant — must point to the service name inside compose network
      CONDUIT_CONFIG: /app/config.json
      CONDUIT_DATA_DIR: /data
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      # Ollama runs as the compose service above — reached by service name,
      # not the host, so this works the same on Linux/Mac/Windows.
      EMBEDDING_BASE_URL: http://ollama:11434/v1
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text-v2-moe}
      # Max in-flight embed calls during a sync — keep in step with
      # OLLAMA_NUM_PARALLEL above so requests aren't queued on either side.
      EMBEDDING_CONCURRENCY: ${EMBEDDING_CONCURRENCY:-4}
      PREPROCESSING_BASE_URL: http://ollama:11434/v1
      PREPROCESSING_MODEL: ${PREPROCESSING_MODEL:-llama3.2:3b}
      PREPROCESSING_CONCURRENCY: ${PREPROCESSING_CONCURRENCY:-4}
      # Optional: stable Fernet key for credential encryption (base64url, 44 chars).
      # If not set, a key is auto-generated in the data volume on first start.
      # CONDUIT_SECRET_KEY: ${CONDUIT_SECRET_KEY:-}
    depends_on:
      qdrant:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

volumes:
  qdrant_data:
  conduit_data:
  ollama_data:
