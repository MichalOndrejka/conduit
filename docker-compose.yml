# Full Conduit stack: Conduit + Qdrant + Ollama, plus a one-shot `setup`
# step that downloads the configured models, checks GPU placement, and only
# then lets Conduit start.
#
# Install straight from GitHub (no clone needed). Run it attached the first
# time so setup's verdict and any warnings are visible; once it says
# "Setup done", Ctrl+C and re-run the same command with -d:
#   docker compose -f https://github.com/MichalOndrejka/conduit.git#main:docker-compose.yml up
#   docker compose -f https://github.com/MichalOndrejka/conduit.git#main:docker-compose.yml up -d
# Later: `docker compose -p conduit logs setup|conduit`, `... -p conduit down`.
#
# From a clone:  docker compose up --build
#
# Services reach each other by name on the compose network, so nothing here
# depends on Docker being able to reach the host's localhost.
#
# Ollama runs on CPU by default. For a GPU, add an overlay as a second -f
# (or set COMPOSE_FILE in .env — see .env.example). With an overlay, setup
# fails unless the models really run on the GPU:
#   -f docker-compose.nvidia.yml   NVIDIA — Windows (Docker Desktop/WSL2) and Linux
#   -f docker-compose.amd.yml      AMD (ROCm) — Linux only
#
# Behind a corporate TLS-interception proxy, export the CA bundle first
# (scripts/export-ca-certs.ps1 writes ./certs), point CONDUIT_CERTS_DIR at it,
# and set HTTPS_PROXY (see docs/installation.md). The certs folder is
# added to — not substituted for — each image's own CA list.

# Fixed so the stack is the same project whichever folder it's started from,
# and follow-up commands can use `docker compose -p conduit ...`.
name: conduit

services:
  qdrant:
    image: qdrant/qdrant:v1.13.6
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    # Not published by default, to avoid clashing with a Qdrant already on
    # the host. Uncomment for the dashboard at http://localhost:6333/dashboard.
    # ports:
    #   - "127.0.0.1:6333:6333"
    healthcheck:
      # The qdrant image has no curl/wget; probe the port with bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
      # Default resolves inside the repo (empty certs/ folder). When installed
      # from the GitHub URL that's Compose's clone, so set CONDUIT_CERTS_DIR
      # to an absolute path for your own bundle.
      - ${CONDUIT_CERTS_DIR:-./certs}:/certs:ro
    # Not published by default, to avoid clashing with an Ollama already on
    # the host. Uncomment to run `ollama` commands against it from the host.
    # ports:
    #   - "127.0.0.1:11434:11434"
    environment:
      # Model downloads are made by this server, not by setup, so the proxy
      # and CA settings belong here. Pulls are HTTPS-only; HTTP_PROXY is
      # deliberately not passed, because the image's OLLAMA_HOST is 0.0.0.0,
      # which Go doesn't treat as loopback, so the healthcheck's
      # `ollama list` would be sent to the proxy and fail.
      SSL_CERT_DIR: /certs
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,qdrant,ollama,conduit,${NO_PROXY:-}
      # Process concurrent requests instead of queuing them — keep in step
      # with EMBEDDING_CONCURRENCY / PREPROCESSING_CONCURRENCY below.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-4}
      # Keep the embedding and preprocessing models resident together, so a
      # sync doesn't evict and reload one to run the other.
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      # Keep models warm between syncs.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot `conduit setup` (see internal/setup): checks Qdrant and Ollama,
  # downloads missing models with progress, loads each one and reports
  # GPU/CPU placement. Exits non-zero on a hard problem (unreachable service,
  # failed download, GPU overlay that ended up on CPU), which keeps Conduit
  # from starting; CPU without an overlay is only a warning.
  setup:
    build: .
    image: michalondrejka/conduit:latest
    command: ["setup"]
    environment:
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_BASE_URL: http://ollama:11434/v1
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text-v2-moe}
      PREPROCESSING_BASE_URL: http://ollama:11434/v1
      PREPROCESSING_MODEL: ${PREPROCESSING_MODEL:-llama3.2:3b}
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy

  conduit:
    build: .
    image: michalondrejka/conduit:latest
    restart: unless-stopped
    # Loopback only: Conduit has no authentication, so it must not be
    # reachable from other machines on the network.
    ports:
      - "127.0.0.1:${CONDUIT_PORT:-8000}:8000"
    volumes:
      - conduit_data:/data
      - ${CONDUIT_CERTS_DIR:-./certs}:/certs:ro
    environment:
      # CA bundle and proxy for Azure DevOps and other source APIs. Service
      # names are always in NO_PROXY so intra-compose traffic skips the proxy.
      SSL_CERT_DIR: /certs
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,qdrant,ollama,conduit,${NO_PROXY:-}
      QDRANT_URL: http://qdrant:6333
      # These env vars override the Settings page on every start, so models
      # are changed here (and in .env) — setup downloads the same ones.
      # Changing EMBEDDING_MODEL drops the index on the next start (logged);
      # re-sync your sources afterwards.
      EMBEDDING_BASE_URL: http://ollama:11434/v1
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text-v2-moe}
      EMBEDDING_CONCURRENCY: ${EMBEDDING_CONCURRENCY:-4}
      PREPROCESSING_BASE_URL: http://ollama:11434/v1
      PREPROCESSING_MODEL: ${PREPROCESSING_MODEL:-llama3.2:3b}
      PREPROCESSING_CONCURRENCY: ${PREPROCESSING_CONCURRENCY:-4}
      # Optional stable Fernet key for stored credentials; auto-generated in
      # /data when unset.
      CONDUIT_SECRET_KEY: ${CONDUIT_SECRET_KEY:-}
    depends_on:
      qdrant:
        condition: service_healthy
      setup:
        condition: service_completed_successfully

volumes:
  qdrant_data:
  ollama_data:
  conduit_data:
