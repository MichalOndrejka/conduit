services:
  qdrant:
    image: qdrant/qdrant:v1.13.6
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      # The qdrant image has no curl/wget; probe the port with bash's /dev/tcp instead.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  conduit:
    image: michalondrejka/conduit:latest
    ports:
      - "8000:8000"
    volumes:
      - conduit_data:/data
    environment:
      # Bind to all interfaces inside the container so the port mapping below
      # can reach it (the Go binary defaults to loopback-only otherwise).
      - CONDUIT_HOST=0.0.0.0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # Ollama runs on the host, not in this compose network.
      - EMBEDDING_BASE_URL=http://host.docker.internal:11434/v1
      # Add your credential env vars here, e.g.:
      # - ADO_PAT=${ADO_PAT}
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_data:
  conduit_data:
