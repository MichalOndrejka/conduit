{{define "title"}}Experience — Conduit{{end}}
{{define "content"}}
<div class="flex items-center justify-between mb-6 flex-wrap gap-3">
  <h1 class="text-2xl font-semibold text-white">Experience</h1>
  <div class="flex items-center gap-3">
    <a href="/map?kind=experience" class="rounded-lg border border-slate-700 px-4 py-2 text-sm hover:bg-slate-800">Vector map</a>
    <a href="/experience/create" class="rounded-lg bg-violet-600 px-4 py-2 text-sm font-semibold text-white hover:bg-violet-500">New experience</a>
  </div>
</div>

{{if not .Entries}}
<div class="rounded-2xl border border-dashed border-slate-700 p-10 text-center text-slate-400">
  No experience entries stored yet.
</div>
{{else}}
<div class="space-y-3">
  {{range .Entries}}
  <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-4">
    <div class="flex items-start justify-between gap-3">
      <div class="min-w-0">
        <div class="text-sm font-medium text-white mb-1">{{.Situation}}</div>
        <div class="text-sm text-slate-300">{{.Guidance}}</div>
      </div>
      {{if .ID}}
      <form method="post" action="/experience/{{.ID}}/delete" onsubmit="return confirm('Delete this experience?')">
        <button type="submit" class="shrink-0 text-xs rounded-lg border border-red-900 text-red-400 px-3 py-1.5 hover:bg-red-950">Delete</button>
      </form>
      {{end}}
    </div>
  </div>
  {{end}}
</div>
{{if .NextOffset}}
<div class="mt-6">
  <a href="/experience?offset={{.NextOffset}}"
     class="inline-block rounded-lg border border-slate-700 px-4 py-2 text-sm hover:bg-slate-800">Next page &rarr;</a>
</div>
{{end}}
{{end}}
{{end}}
