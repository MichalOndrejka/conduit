{{define "title"}}Add credential — Conduit{{end}}
{{define "content"}}
<div class="mb-6">
  <a href="/credentials" class="text-sm text-slate-400 hover:text-white">&larr; Credentials</a>
  <h1 class="text-2xl font-semibold text-white mt-2">Add credential</h1>
</div>

{{if .Error}}
<script>showToast({{.Error}}, 'error');</script>
{{end}}

<div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-5 max-w-2xl">
  <form method="post" action="/credentials/create" class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-xs font-medium text-slate-400 mb-1">Name</label>
      <input name="name" required placeholder="e.g. ado-pat" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm font-mono">
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-400 mb-1">Secret value</label>
      <input name="value" type="password" required placeholder="Secret value" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm font-mono">
    </div>
    <button type="submit" class="md:col-span-2 rounded-lg bg-violet-600 px-4 py-2 text-sm font-semibold text-white hover:bg-violet-500 justify-self-start">Add credential</button>
  </form>
</div>
{{end}}
