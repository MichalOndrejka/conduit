{{define "title"}}{{.Source.Name}} — items — Conduit{{end}}
{{define "content"}}
<div class="mb-6">
  <a href="/" class="text-sm text-slate-400 hover:text-white">&larr; Sources</a>
  <h1 class="text-2xl font-semibold text-white mt-2">{{.Source.Name}}</h1>
</div>

{{if not .Items}}
<div class="rounded-2xl border border-dashed border-slate-700 p-10 text-center text-slate-400">
  No indexed items for this source.
</div>
{{else}}
<div class="space-y-3">
  {{range .Items}}
  <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-4">
    <div class="text-xs font-mono text-slate-500 mb-2">{{.ID}}</div>
    <pre class="text-sm text-slate-300 whitespace-pre-wrap break-words max-h-48 overflow-y-auto">{{.Text}}</pre>
  </div>
  {{end}}
</div>
{{if .NextOffset}}
<div class="mt-6">
  <a href="/sources/{{.Source.ID}}/items?offset={{.NextOffset}}"
     class="inline-block rounded-lg border border-slate-700 px-4 py-2 text-sm hover:bg-slate-800">Next page &rarr;</a>
</div>
{{end}}
{{end}}
{{end}}
