<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Conduit</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen grid place-items-center" style="font-family:Inter,system-ui,sans-serif">
  <div class="w-full max-w-sm p-8">
    <div class="flex items-center gap-2 mb-8 justify-center">
      <span class="inline-block h-10 w-10 rounded-xl bg-violet-600 text-white grid place-items-center text-lg font-bold">C</span>
      <span class="text-2xl font-semibold text-white">Conduit</span>
    </div>
    <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-6 shadow-xl">
      <h1 class="text-lg font-semibold text-white mb-1">Sign in</h1>
      <p class="text-sm text-slate-400 mb-5">Enter the owner credentials to continue.</p>
      {{if .Error}}
      <div class="mb-4 rounded-lg border border-red-800 bg-red-950/50 px-3 py-2 text-sm text-red-300">{{.Error}}</div>
      {{end}}
      <form method="post" action="/login" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1" for="email">Email</label>
          <input id="email" name="email" type="email" required autofocus autocomplete="username"
                 class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm focus:border-violet-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1" for="password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password"
                 class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm focus:border-violet-500 focus:outline-none">
        </div>
        <button type="submit"
                class="w-full rounded-lg bg-violet-600 px-3 py-2 text-sm font-semibold text-white hover:bg-violet-500">
          Sign in
        </button>
      </form>
    </div>
  </div>
</body>
</html>
