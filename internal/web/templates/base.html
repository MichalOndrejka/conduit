{{define "base"}}<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <script>if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark');</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}Conduit{{end}}</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    // Global toast notifications — top-right of the viewport (fixed, so it
    // stays put regardless of page scroll), used for one-off flash messages
    // (save confirmations, errors) that pages would otherwise render as
    // static banners easy to miss. Defined in <head> (rather than at the end
    // of <body>) so it exists before any inline showToast(...) call in a
    // page's own content runs — document order matters since <script> tags
    // execute as they're parsed. #toast-container itself (in <body>, before
    // <main>) is always parsed by the time content scripts run.
    var TOAST_STYLES = {
      ok: 'border-emerald-800 bg-emerald-950/95 text-emerald-300',
      warn: 'border-amber-800 bg-amber-950/95 text-amber-300',
      error: 'border-red-800 bg-red-950/95 text-red-300',
    };
    function showToast(message, type) {
      if (!message) return;
      var container = document.getElementById('toast-container');
      var toast = document.createElement('div');
      toast.className = 'pointer-events-auto rounded-lg border px-3 py-2 text-sm shadow-lg transition-all duration-300 ' +
        (TOAST_STYLES[type] || TOAST_STYLES.ok);
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(1rem)';
      toast.textContent = message;
      container.appendChild(toast);
      requestAnimationFrame(function () {
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(0)';
      });
      setTimeout(function () {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(1rem)';
        setTimeout(function () { toast.remove(); }, 300);
      }, type === 'error' ? 6000 : 4000);
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-200 font-sans min-h-screen">
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col items-end gap-2 w-full max-w-sm pointer-events-none"></div>
  <div class="flex min-h-screen">
    <aside class="w-56 shrink-0 border-r border-slate-800 bg-slate-900/60 p-4 hidden md:flex md:flex-col sticky top-0 h-screen">
      <a href="/" class="flex items-center gap-2 mb-8">
        <svg class="h-8 w-8 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <defs><linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#6d28d9"/>
          </linearGradient></defs>
          <rect width="24" height="24" rx="5" fill="url(#logo-g)"/>
          <path d="M13 10V3L4 14h7v7l9-11h-7z" fill="none" stroke="white"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="text-lg font-semibold text-white">Conduit</span>
      </a>
      <nav class="space-y-1 text-sm flex-1">
        <a href="/" class="block rounded-lg px-3 py-2 hover:bg-slate-800 {{if eq .Active "sources"}}bg-slate-800 text-white{{end}}">Sources</a>
        <a href="/experience" class="block rounded-lg px-3 py-2 hover:bg-slate-800 {{if eq .Active "experience"}}bg-slate-800 text-white{{end}}">Experience</a>
        <a href="/credentials" class="block rounded-lg px-3 py-2 hover:bg-slate-800 {{if eq .Active "credentials"}}bg-slate-800 text-white{{end}}">Credentials</a>
        <a href="/settings" class="block rounded-lg px-3 py-2 hover:bg-slate-800 {{if eq .Active "settings"}}bg-slate-800 text-white{{end}}">Settings</a>
      </nav>
      <button id="theme-toggle" type="button"
              class="flex items-center justify-between w-full rounded-lg px-3 py-2 mb-1 text-sm text-slate-400 hover:bg-slate-800 hover:text-white transition-colors">
        <span id="theme-label">Light mode</span>
        <span class="relative w-4 h-4 shrink-0">
          <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               class="absolute inset-0 w-4 h-4" style="transition:opacity .3s,transform .3s">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               class="absolute inset-0 w-4 h-4" style="transition:opacity .3s,transform .3s;opacity:0;transform:rotate(90deg) scale(.5)">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </span>
      </button>
    </aside>
    <main class="flex-1 p-6 md:p-10 w-full max-w-6xl mx-auto">
      {{block "content" .}}{{end}}
    </main>
  </div>
  <script>
    (function () {
      var sun = document.getElementById('icon-sun');
      var moon = document.getElementById('icon-moon');
      var label = document.getElementById('theme-label');

      function setTheme(dark) {
        document.documentElement.classList.toggle('dark', dark);
        localStorage.setItem('theme', dark ? 'dark' : 'light');
        if (dark) {
          sun.style.opacity = '1'; sun.style.transform = 'rotate(0deg) scale(1)';
          moon.style.opacity = '0'; moon.style.transform = 'rotate(90deg) scale(.5)';
          label.textContent = 'Light mode';
        } else {
          sun.style.opacity = '0'; sun.style.transform = 'rotate(-90deg) scale(.5)';
          moon.style.opacity = '1'; moon.style.transform = 'rotate(0deg) scale(1)';
          label.textContent = 'Dark mode';
        }
      }

      setTheme(document.documentElement.classList.contains('dark'));
      document.getElementById('theme-toggle').addEventListener('click', function () {
        setTheme(!document.documentElement.classList.contains('dark'));
      });
    })();
  </script>
</body>
</html>{{end}}
