{{define "base"}}<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}Conduit{{end}}</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-200 font-sans min-h-screen">
  <div class="flex min-h-screen">
    <aside class="w-56 shrink-0 border-r border-slate-800 bg-slate-900/60 p-4 hidden md:flex md:flex-col">
      <a href="/" class="flex items-center gap-2 mb-8">
        <span class="inline-block h-8 w-8 rounded-lg bg-violet-600 text-white grid place-items-center font-bold">C</span>
        <span class="text-lg font-semibold text-white">Conduit</span>
      </a>
      <nav class="space-y-1 text-sm flex-1">
        <a href="/" class="block rounded-lg px-3 py-2 hover:bg-slate-800 {{if eq .Active "sources"}}bg-slate-800 text-white{{end}}">Sources</a>
        <a href="/experience" class="block rounded-lg px-3 py-2 hover:bg-slate-800 {{if eq .Active "experience"}}bg-slate-800 text-white{{end}}">Experience</a>
        <a href="/credentials" class="block rounded-lg px-3 py-2 hover:bg-slate-800 {{if eq .Active "credentials"}}bg-slate-800 text-white{{end}}">Credentials</a>
        <a href="/settings" class="block rounded-lg px-3 py-2 hover:bg-slate-800 {{if eq .Active "settings"}}bg-slate-800 text-white{{end}}">Settings</a>
      </nav>
      <form method="post" action="/logout">
        <button type="submit" class="w-full text-left rounded-lg px-3 py-2 text-sm text-slate-400 hover:bg-slate-800 hover:text-white">Sign out</button>
      </form>
    </aside>
    <main class="flex-1 p-6 md:p-10 w-full max-w-6xl mx-auto">
      {{block "content" .}}{{end}}
    </main>
  </div>
</body>
</html>{{end}}
