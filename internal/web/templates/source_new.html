{{define "title"}}Add source — Conduit{{end}}
{{define "content"}}
<div class="mb-6">
  <a href="/" class="text-sm text-slate-400 hover:text-white">&larr; Sources</a>
  <h1 class="text-2xl font-semibold text-white mt-2">Add a source</h1>
  <p class="text-sm text-slate-400 mt-1">Choose what to index. Next you'll connect it to Azure DevOps, an HTTP API, or paste a document.</p>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
  {{range .SourceTypes}}
  <a href="/sources/create?type={{.Value}}"
     class="group rounded-2xl border border-slate-800 bg-slate-900/60 p-4 transition-colors hover:border-violet-600 hover:bg-slate-900">
    <div class="text-sm font-medium text-white group-hover:text-violet-300">{{.Label}}</div>
    <div class="text-xs text-slate-500 mt-1 leading-relaxed">{{.Description}}</div>
  </a>
  {{end}}
</div>
{{end}}
