# Conduit (Go) demo stack: Caddy (auto-HTTPS) → Conduit → Qdrant.
# Components stay in separate containers — different lifecycles and resource
# profiles. Embeddings come from hosted Azure OpenAI (no in-box model), which
# keeps the whole stack comfortable on a 1–2 GB VM.
#
# Usage:
#   DOMAIN=conduit.example.com CONDUIT_OWNER_EMAIL=you@example.com \
#   CONDUIT_OWNER_PASSWORD=... docker compose -f docker-compose.go.yml up -d
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?Set DOMAIN to your public hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - conduit

  conduit:
    build:
      context: .
      dockerfile: Dockerfile.golang
    restart: unless-stopped
    # No host port mapping — only reachable through Caddy.
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - CONDUIT_DATA_DIR=/data
      # n8n-style owner login (or omit both and use first-run /setup)
      - CONDUIT_OWNER_EMAIL=${CONDUIT_OWNER_EMAIL:-}
      - CONDUIT_OWNER_PASSWORD=${CONDUIT_OWNER_PASSWORD:-}
      # Bearer key for headless MCP clients
      - CONDUIT_API_KEY=${CONDUIT_API_KEY:-}
      # Pin in production so credentials survive container recreation
      - CONDUIT_SECRET_KEY=${CONDUIT_SECRET_KEY:-}
      # Embeddings: hosted Azure OpenAI (recommended for the demo)
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-azure-openai}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-1536}
    volumes:
      - conduit_data:/data
    depends_on:
      qdrant:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.13.6
    restart: unless-stopped
    # No host port mapping — internal only.
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  caddy_data:
  caddy_config:
  conduit_data:
  qdrant_data:
